<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TickStack clock favicon">
  <defs>
    <style>
      .bg { fill: #151b18; }
      .ring { fill: none; stroke: #dff7b0; stroke-width: 3; }
      .hand { fill: none; stroke: #dff7b0; stroke-linecap: round; }
      .hand-minute { stroke-width: 3; }
      .hand-hour { stroke-width: 4; }
      .center { fill: #dff7b0; }
    </style>
  </defs>
  <rect class="bg" x="2" y="2" width="60" height="60" rx="12"/>
  <circle class="ring" cx="32" cy="32" r="20"/>
  <path class="hand hand-hour" d="M32 32 L32 18"/>
  <path class="hand hand-minute" d="M32 32 L45 26"/>
  <circle class="center" cx="32" cy="32" r="3.5"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="#7b8d82" stroke-width="1.5" opacity="0.6"/>
</svg>
